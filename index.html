<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Panel de Administración de Empleados</title>
    <link rel="stylesheet" href="css/estilo.css" />
  </head>
  <body>
    <header>
      <h1>Panel de Administración de Empleados</h1>
      <p>Gestión de departamentos, empleados y asistencias</p>
    </header>

    <main>
      <!-- ===================== DEPARTAMENTOS ===================== -->
      <section id="seccion-departamentos" aria-labelledby="titulo-departamentos">
        <h2 id="titulo-departamentos">Departamentos</h2>

        <!-- novalidate: las validaciones las hace app.js con mensajes propios -->
        <form id="form-departamento" novalidate>
          <input type="hidden" id="departamento-id" />

          <div class="campo">
            <label for="departamento-nombre">Nombre</label>
            <input type="text" id="departamento-nombre" placeholder="Ej: Sistemas" maxlength="40" />
            <span class="error" id="error-departamento-nombre" role="alert"></span>
          </div>

          <div class="campo">
            <label for="departamento-responsable">Responsable</label>
            <input type="text" id="departamento-responsable" placeholder="Ej: Ing. Carlos Pérez" maxlength="60" />
            <span class="error" id="error-departamento-responsable" role="alert"></span>
          </div>

          <div class="acciones">
            <button type="submit" id="btn-guardar-departamento" class="btn-primary">Guardar departamento</button>
            <button type="button" id="btn-cancelar-departamento">Cancelar</button>
          </div>
        </form>

        <div id="contenedor-departamentos" class="grid-cards"></div>
      </section>

      <!-- ===================== EMPLEADOS ===================== -->
      <section id="seccion-empleados" aria-labelledby="titulo-empleados">
        <h2 id="titulo-empleados">Empleados</h2>

        <form id="form-empleado" novalidate>
          <input type="hidden" id="empleado-id" />

          <div class="campo">
            <label for="empleado-nombre">Nombre completo</label>
            <input type="text" id="empleado-nombre" placeholder="Ej: Laura Martínez" maxlength="60" />
            <span class="error" id="error-empleado-nombre" role="alert"></span>
          </div>

          <div class="campo">
            <label for="empleado-cargo">Cargo</label>
            <input type="text" id="empleado-cargo" placeholder="Ej: Desarrolladora" maxlength="40" />
            <span class="error" id="error-empleado-cargo" role="alert"></span>
          </div>

          <div class="campo">
            <label for="empleado-fecha">Fecha de ingreso</label>
            <input type="date" id="empleado-fecha" />
            <span class="error" id="error-empleado-fecha" role="alert"></span>
          </div>

          <div class="campo">
            <label for="empleado-departamento">Departamento</label>
            <select id="empleado-departamento">
              <option value="">Seleccione departamento</option>
            </select>
            <span class="error" id="error-empleado-departamento" role="alert"></span>
          </div>

          <div class="acciones">
            <button type="submit" id="btn-guardar-empleado" class="btn-primary">Guardar empleado</button>
            <button type="button" id="btn-cancelar-empleado">Cancelar</button>
          </div>
        </form>

        <div class="filtro">
          <label for="filtro-departamento">Filtrar empleados por departamento:</label>
          <select id="filtro-departamento">
            <option value="">Todos los departamentos</option>
          </select>
        </div>

        <div id="contenedor-empleados" class="grid-cards"></div>
      </section>

      <!-- ===================== ASISTENCIAS ===================== -->
      <section id="seccion-asistencias" aria-labelledby="titulo-asistencias">
        <h2 id="titulo-asistencias">Asistencias</h2>

        <form id="form-asistencia" novalidate>
          <div class="campo">
            <label for="asistencia-empleado">Empleado</label>
            <select id="asistencia-empleado">
              <option value="">Seleccione empleado</option>
            </select>
            <span class="error" id="error-asistencia-empleado" role="alert"></span>
          </div>

          <div class="campo">
            <label for="asistencia-fecha">Fecha</label>
            <input type="date" id="asistencia-fecha" />
            <span class="error" id="error-asistencia-fecha" role="alert"></span>
          </div>

          <div class="campo">
            <label for="asistencia-estado">Estado</label>
            <select id="asistencia-estado">
              <option value="Presente">Presente</option>
              <option value="Ausente">Ausente</option>
              <option value="Tardanza">Tardanza</option>
            </select>
            <span class="error" id="error-asistencia-estado" role="alert"></span>
          </div>

          <div class="acciones">
            <button type="submit" class="btn-primary">Registrar asistencia</button>
          </div>
        </form>

        <!-- Resumen global (contadores) -->
        <h3>Resumen general</h3>
        <div id="resumen-asistencias" class="resumen"></div>

        <!-- Estadísticas por empleado -->
        <h3>Estadísticas por empleado</h3>
        <div class="tabla-wrapper">
          <table id="tabla-estadisticas">
            <thead>
              <tr>
                <th>Empleado</th>
                <th>Presentes</th>
                <th>Ausentes</th>
                <th>Tardanzas</th>
                <th>Total</th>
                <th>% Asistencia</th>
              </tr>
            </thead>
            <tbody id="cuerpo-estadisticas"></tbody>
          </table>
        </div>

        <!-- Historial -->
        <h3>Historial</h3>
        <div class="filtro">
          <label for="filtro-empleado-asistencia">Ver historial de:</label>
          <select id="filtro-empleado-asistencia">
            <option value="">Todos los empleados</option>
          </select>
        </div>

        <div id="contenedor-asistencias" class="grid-cards"></div>
      </section>
    </main>

    <!-- Mensajes de confirmación / error (reemplaza a los alert) -->
    <div id="toast" role="status" aria-live="polite"></div>

    <!-- Ya no se usa axios ni json-server: los datos viven en localStorage -->
    <script src="js/app.js"></script>
  </body>
</html>
